# CI do projeto — o gate que a Phase 8 do plano do frontend pedia.
#
# O job de backend roda DENTRO do docker compose, e não com `services:` do
# GitHub Actions. Reproduzir o ambiente à mão exigiria recriar o init.sql das
# extensões, as variáveis do .env e o setup de RLS — um segundo ambiente,
# parecido mas não igual, que envelhece em silêncio até o dia em que o CI passa
# e a máquina de alguém não (ou o contrário). Aqui `make cov` e o CI executam
# literalmente o mesmo comando no mesmo container.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch: sem isso, uma
# sequência rápida de commits enfileira builds que ninguém vai ler.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # O compose declara `env_file: .env`, que não é versionado. Copiar o
      # exemplo também o VALIDA: se alguém acrescentar uma variável obrigatória
      # às settings sem registrá-la no .env.example, este job quebra — que é
      # exatamente quando se quer descobrir, e não no onboarding do próximo.
      - name: Preparar .env
        run: cp .env.example .env

      - name: Subir a stack
        run: docker compose up -d --wait db redis web

      # Os `.txt` declaram intenção; os `.lock` declaram o que será instalado.
      # Editar um sem regenerar o outro faz a imagem instalar algo diferente do
      # que se pediu — e, como o Dockerfile usa `--require-hashes`, o build
      # quebraria só lá na frente, com uma mensagem sobre hash em vez de sobre
      # a dependência que alguém acrescentou.
      #
      # A receita é a do `make locks-check`, e não uma cópia dela aqui: duas
      # versões do mesmo comando divergem em silêncio, e a que decide o merge
      # seria a que ninguém roda na máquina. Só a anotação de erro é daqui.
      - name: Os locks estão em dia com os .txt
        run: |
          make locks-check || {
            echo "::error::requirements/*.lock dessincronizado — rode 'make locks' e commite o resultado"
            exit 1
          }

      - name: Lint
        run: docker compose exec -T web ruff check .

      # `--cov` carrega o fail_under = 85 do .coveragerc. O gate de cobertura é
      # o do backend, não um número escrito de novo aqui.
      - name: Testes + gate de cobertura
        run: docker compose exec -T web pytest --cov

      # Logs do container quando algo quebra. Sem isto, uma falha de boot
      # aparece como um passo vermelho sem nenhuma pista do motivo.
      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

  frontend:
    name: frontend — typecheck + lint + testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, não `install`: falha se package.json e lockfile discordarem, em
      # vez de resolver versões novas e testar algo diferente do que se commitou.
      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Os thresholds de 85% vivem em vitest.config.ts, espelhando o .coveragerc.
      - name: Testes + cobertura
        run: npm run test -- --coverage

  # As imagens de PRODUÇÃO, exercitadas de verdade.
  #
  # Os outros jobs rodam a imagem de desenvolvimento: o compose sobrescreve
  # `command:` em todo serviço, então nem o `docker/entrypoint.sh` nem o nginx
  # do frontend chegam a executar. Sem este job, o caminho que efetivamente vai
  # para o Railway é o único do repositório que ninguém nunca roda — e a
  # primeira execução seria o primeiro deploy.
  producao:
    name: imagens de produção — sobem e respondem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar .env
        run: cp .env.example .env

      # Redis junto: o throttle guarda os contadores no cache, e sem ele a
      # imagem de producao exercitaria apenas o caminho de falha (que libera a
      # requisicao). O objetivo aqui e o caminho normal.
      - name: Subir banco e cache
        run: docker compose up -d --wait db redis

      # `REQUIREMENTS=base.lock` é o ponto: a imagem de produção não leva pytest,
      # ruff nem factory-boy. Se algum código de aplicação importar algo que só
      # existe em dev.txt, o build ou o boot quebram aqui.
      - name: Construir a imagem do backend
        run: docker build --build-arg REQUIREMENTS=base.lock -t rt-api:prod .

      # O entrypoint de verdade: migrate e depois `exec gunicorn` na $PORT.
      # `--network host` para alcançar o Postgres publicado pelo compose.
      - name: Servir com gunicorn
        run: |
          docker run -d --name rt-api --network host             -e PORT=8000             -e DJANGO_SECRET_KEY=ci-only-n7Qw2Kx9Lp4Zr8Vt6Ys1Bd3Fg5Hj0Mn7Pq2Rs4             -e DJANGO_ALLOWED_HOSTS=localhost             -e CORS_ALLOWED_ORIGINS=https://front.invalid             -e DATABASE_URL=postgres://remind:remind@localhost:5432/remind             -e CACHE_URL=redis://localhost:6379/1 -e RAILWAY_PUBLIC_DOMAIN=web-ci.up.railway.app rt-api:prod

      # `X-Forwarded-Proto: https` não é truque de teste: é exatamente o header
      # que o proxy do Railway injeta, e é o que `SECURE_PROXY_SSL_HEADER` lê.
      # Sem ele o SECURE_SSL_REDIRECT responde 301 e o teste mediria o redirect
      # em vez da aplicação.
      - name: Esperar o health responder
        run: |
          for i in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}'               -H 'X-Forwarded-Proto: https'               http://localhost:8000/api/health/ || true)
            if [ "$codigo" = "200" ]; then
              echo "health respondeu 200 na tentativa $i"
              exit 0
            fi
            sleep 2
          done
          echo "::error::gunicorn não respondeu 200 em /api/health/ (último código: $codigo)"
          docker logs rt-api
          exit 1

      # O healthcheck da plataforma, como ele chega DE VERDADE — e é por isso
      # que este passo não manda os dois cabeçalhos do passo acima.
      #
      # O Railway não bate pelo domínio público: alcança o container pela rede
      # interna, em HTTP puro (sem `X-Forwarded-Proto`) e com `Host:
      # healthcheck.railway.app`. Cada uma dessas duas condições, sozinha,
      # reprovava o deploy — 400 por DisallowedHost e 301 por SECURE_SSL_REDIRECT
      # — e deploy reprovado nunca entra em serviço: o domínio devolve 502 com o
      # container de pé. Aconteceu no primeiro deploy real (2026-08-24), no `web`
      # e no `frontend`, os dois únicos serviços com healthcheck declarado.
      #
      # O passo anterior passava porque mandava `Host: localhost` e
      # `X-Forwarded-Proto: https`, contornando exatamente as duas condições.
      - name: O healthcheck da plataforma passa como ele chega
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: healthcheck.railway.app' http://localhost:8000/api/health/)
          if [ "$codigo" != "200" ]; then
            echo "::error::o healthcheck interno recebeu $codigo (400=ALLOWED_HOSTS, 301=SSL redirect) — o deploy seria reprovado e o domínio responderia 502"
            docker logs rt-api | tail -30
            exit 1
          fi
          echo "healthcheck interno: 200"

      # A contraprova: a isenção do redirect vale para UM caminho, não para o
      # serviço. Desligar o SECURE_SSL_REDIRECT inteiro também faria o passo
      # acima passar, e é o que este aqui impede.
      - name: Fora do health, HTTP puro continua redirecionando
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/auth/login/)
          if [ "$codigo" != "301" ] && [ "$codigo" != "302" ]; then
            echo "::error::rota comum em HTTP puro devolveu $codigo em vez de redirect — o SECURE_SSL_REDIRECT foi desligado ou isentado além do health"
            exit 1
          fi
          echo "SECURE_SSL_REDIRECT segue valendo fora do health: $codigo"

      # A rede interna do Railway é IPv6, e é por ela que o edge alcança o
      # container. Com o gunicorn em `0.0.0.0` — IPv4 puro — não havia nada no
      # endereço que a plataforma procura: a conexão não se estabelecia. E o
      # sintoma não tinha pista nenhuma, porque a aplicação subia sem erro e o
      # log ficava limpo justamente por não chegar requisição alguma. O domínio
      # devolvia `502 Application failed to respond`.
      #
      # Todos os outros passos deste job falam IPv4, e por isso nenhum deles
      # pegaria uma volta a `0.0.0.0`.
      - name: O gunicorn escuta em IPv6
        run: |
          docker exec rt-api python -c "
          import http.client, sys
          try:
              c = http.client.HTTPConnection('::1', 8000, timeout=5)
              c.request('GET', '/api/health/', headers={'Host': 'healthcheck.railway.app'})
              r = c.getresponse()
          except OSError as erro:
              sys.exit('ERRO: nada escutando em IPv6 - o edge do Railway nao alcancaria o container (%r)' % erro)
          print('IPv6 ->', r.status)
          if r.status != 200:
              sys.exit('ERRO: IPv6 respondeu %s' % r.status)
          "

      # DJANGO_SETTINGS_MODULE não é passado ao container, de propósito: o
      # entrypoint tem que defaultar para produção sozinho. Se cair no default
      # de dev do `os.environ.setdefault`, o serviço sobe com DEBUG=True, cookie
      # sem Secure e sem HSTS — e nada reclama.
      #
      # A sonda é /proc/1/environ, e não um `docker exec python -c` qualquer: o
      # `export` do entrypoint vive no processo que ele substituiu, e um
      # `docker exec` cria um processo NOVO, que não o herda — foi assim que a
      # primeira versão deste passo falhou medindo a si mesma. Ler o PID 1 prova
      # duas coisas de uma vez: com que settings o gunicorn roda, e que ele é
      # mesmo o PID 1 (logo o `exec` funcionou e o SIGTERM do deploy o alcança).
      - name: O default de settings é produção, e o gunicorn é o PID 1
        run: |
          docker exec rt-api python -c "
          import sys
          bruto = open('/proc/1/environ').read().split(chr(0))
          ambiente = dict(p.split('=', 1) for p in bruto if '=' in p)
          comando = open('/proc/1/cmdline').read().replace(chr(0), ' ').strip()
          modulo = ambiente.get('DJANGO_SETTINGS_MODULE', '(ausente)')
          print('PID 1  :', comando)
          print('settings:', modulo)
          if modulo != 'config.settings.prod':
              sys.exit('ERRO: o PID 1 nao esta em config.settings.prod')
          if 'gunicorn' not in comando:
              sys.exit('ERRO: o PID 1 nao e o gunicorn - o exec sumiu')
          "

      # A contraprova comportamental: com DEBUG=True o Django devolve a página
      # amarela de debug, que lista a URLconf inteira para quem pedir uma rota
      # que não existe. Em produção tem que ser um 404 seco.
      - name: Rota inexistente não vaza a página de debug
        run: |
          corpo=$(curl -s -H 'X-Forwarded-Proto: https' http://localhost:8000/nao-existe-xyz/)
          if echo "$corpo" | grep -qi 'URLconf'; then
            echo "::error::página de debug exposta — o serviço está com DEBUG=True"
            exit 1
          fi
          echo "404 sem página de debug: ok"

      # O limite de taxa, exercitado na imagem de producao contra o Redis de
      # verdade. Anonimo e 60/hora por default; 70 requisicoes tem que esbarrar.
      #
      # Se este passo passar a devolver 200 em todas, o provavel e o cache ter
      # caido para LocMem (contador por worker) ou o fail-open estar mascarando
      # uma queda do Redis — as duas coisas que fazem o teto existir so no papel.
      - name: O limite de taxa vale de ponta a ponta
        run: |
          bateu429=nao
          for i in $(seq 1 70); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}'               -H 'X-Forwarded-Proto: https'               http://localhost:8000/api/health/)
            if [ "$codigo" = "429" ]; then
              echo "429 na requisicao $i — limite aplicado"
              bateu429=sim
              break
            fi
          done
          if [ "$bateu429" = "nao" ]; then
            echo "::error::70 requisicoes anonimas sem nenhum 429 — o limite nao esta valendo"
            docker logs rt-api | tail -30
            exit 1
          fi

      - name: Derrubar o backend
        run: docker rm -f rt-api

      - name: Construir a imagem do frontend
        run: |
          docker build -f frontend/Dockerfile --target producao             --build-arg VITE_API_URL=https://api-ci.invalid/api             -t rt-front:prod .

      # A guarda do ARG. Um build sem a URL emitiria um bundle que chama
      # `undefined/tabelas/` — passa no build, quebra no browser do usuário.
      - name: Build sem VITE_API_URL tem que falhar
        run: |
          if docker build -f frontend/Dockerfile --target producao                -t rt-front:sem-url . >/dev/null 2>&1; then
            echo "::error::o build passou sem VITE_API_URL — a guarda sumiu"
            exit 1
          fi
          echo "guarda do VITE_API_URL: ok"

      - name: Servir o dist com nginx
        run: |
          docker run -d --name rt-front -e PORT=8080 -p 8080:8080 rt-front:prod
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 2
          done

      - name: A SPA é servida
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

      # Mesma causa do passo equivalente do backend: o edge do Railway chega por
      # IPv6. O nginx assume `ipv6only=on` num listener `[::]`, então o template
      # traz as duas linhas de `listen` — e é isto que confere que as duas valem.
      - name: O nginx escuta em IPv6
        run: |
          if ! docker exec rt-front wget -qO- http://[::1]:8080/ >/dev/null; then
            echo "::error::o nginx não atende em IPv6 — o edge do Railway não alcançaria o container e o domínio responderia 502"
            docker exec rt-front cat /etc/nginx/conf.d/default.conf | head -20
            exit 1
          fi
          echo "IPv6: ok"

      # O fallback. Sem `try_files ... /index.html`, recarregar uma rota do
      # React Router dá 404 — e o bug só aparece em deep link, nunca navegando.
      - name: Rota client-side recarregada devolve 200, não 404
        run: |
          for rota in /tabelas/abc /alertas /tabelas/abc/colunas; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$rota")
            test "$codigo" = "200" || {
              echo "::error::$rota devolveu $codigo — fallback da SPA quebrado"
              exit 1
            }
          done

      # A contrapartida: asset inexistente NÃO pode cair no fallback. Se cair, o
      # browser recebe HTML com Content-Type de JavaScript e o erro que aparece
      # é "Unexpected token '<'", que não aponta para lugar nenhum.
      - name: Asset inexistente devolve 404, não o index
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}'             http://localhost:8080/assets/nao-existe-xyz.js)
          test "$codigo" = "404" || {
            echo "::error::/assets/ inexistente devolveu $codigo em vez de 404"
            exit 1
          }

      - name: Logs (em caso de falha)
        if: failure()
        run: |
          docker logs rt-api 2>&1 || true
          docker logs rt-front 2>&1 || true
          docker compose logs --no-color

  # Detector de deriva entre o schema do backend e o cliente tipado.
  #
  # `schema.d.ts` é gerado a partir do OpenAPI que o Django serve. Nada obriga
  # os dois a continuarem de acordo: um serializer muda, o arquivo gerado fica
  # velho, o TypeScript segue compilando contra o contrato ANTIGO e o erro só
  # aparece como campo `undefined` em runtime. Regerar e exigir diff vazio
  # transforma isso em build vermelho no PR que causou a divergência.
  contrato:
    name: contrato — schema x cliente tipado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar .env
        run: cp .env.example .env

      - name: Subir a API
        run: docker compose up -d --wait db redis web

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      # `api:types` gera E passa o prettier. Os dois passos são necessários para
      # este job significar alguma coisa: o openapi-typescript indenta com o
      # estilo dele, o repositório guarda o arquivo formatado, e sem normalizar
      # o diff nunca seria vazio — o job falharia sempre, por formatação, e
      # seria desligado por inútil antes de pegar a primeira deriva de verdade.
      - name: Regerar os tipos a partir do schema no ar
        working-directory: frontend
        run: npm run api:types

      - name: Exigir diff vazio
        run: |
          if ! git diff --exit-code --stat -- frontend/src/api/schema.d.ts; then
            echo "::error file=frontend/src/api/schema.d.ts::O schema da API mudou e os tipos gerados não foram atualizados. Rode 'npm run api:types' no frontend e commite o resultado."
            git diff -- frontend/src/api/schema.d.ts
            exit 1
          fi

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

  # ------------------------------------------------------------ pós-deploy
  #
  # Quem implanta é o Railway, não este workflow: os serviços têm
  # `source: github(REPO, { branch: BRANCH })` em `.railway/railway.ts`, então o
  # push para `main` já dispara o deploy sozinho. Escrever um `railway up` aqui
  # criaria um segundo caminho de implantação — dois jeitos de colocar código no
  # ar, um deles usado só às vezes, é como se ganha uma diferença entre o que se
  # testou e o que está rodando.
  #
  # O papel do CI depois do deploy é outro: OLHAR. O objetivo da Phase 9 é saber
  # que quebrou antes do usuário contar, e o endpoint que responde isso agora
  # cobre o Redis também.
  #
  # ⚠️ O que este job NÃO prova: que a revisão nova é a que está respondendo.
  # Sem um endpoint de versão, um 200 aqui pode vir da revisão anterior ainda em
  # serviço. Quem gateia a troca de revisão é o healthcheck do próprio Railway
  # (`healthcheck: "/api/health/"`); este job cobre o que aquele não olha — as
  # dependências — e serve de registro de que a aplicação respondeu depois do
  # deploy.
  pos-deploy:
    name: pós-deploy — as dependências no ar respondem
    runs-on: ubuntu-latest
    needs: [backend, frontend, producao, contrato]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Variável de repositório, não segredo: é um domínio público, e segredo
      # aqui só dificultaria diagnosticar o job sem esconder nada de ninguém.
      - name: A URL de produção está configurada?
        id: alvo
        run: |
          if [ -z "${{ vars.URL_PRODUCAO }}" ]; then
            echo "::warning::variável de repositório URL_PRODUCAO não configurada — verificação pós-deploy pulada. Defina-a em Settings > Secrets and variables > Actions > Variables (ex.: https://web-xxxx.up.railway.app)."
            echo "configurado=nao" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=sim" >> "$GITHUB_OUTPUT"
          fi

      # A janela é generosa de propósito: o Railway constrói a imagem do zero a
      # cada push, e um build lento seguido de um migrate no start passa
      # facilmente de dois minutos. Um timeout curto aqui reprovaria deploys
      # sadios, e um job que reprova sem motivo é desligado antes de pegar o
      # primeiro problema de verdade.
      - name: As dependências respondem depois do deploy
        if: steps.alvo.outputs.configurado == 'sim'
        run: |
          alvo="${{ vars.URL_PRODUCAO }}/api/health/ready/"
          for i in $(seq 1 40); do
            corpo=$(curl -fsS --max-time 10 "$alvo" 2>/dev/null || true)
            case "$corpo" in
              *'"status":"ok"'*)
                echo "pós-deploy: $corpo"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "::error::$alvo não reportou status ok em 10 minutos. Última resposta: ${corpo:-<sem resposta>}"
          echo "503 com \"redis\":\"down\" é o cache fora — o serviço responde, alertas e limite de taxa é que não."
          exit 1
