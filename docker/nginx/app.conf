# Nginx de BORDA para a VPS — roda no HOST (apt install nginx certbot
# python3-certbot-nginx), não em container. Mais simples de depurar e renovar
# certificado do que nginx-dentro-de-nginx, e é o caminho documentado do
# Certbot para VPS.
#
# Isto é REFERÊNCIA versionada, não aplicada automaticamente: copie para
# /etc/nginx/sites-available/remind-task, troque app.exemplo.com pelo domínio
# real, ative com `ln -s ... /etc/nginx/sites-enabled/` e rode
# `certbot --nginx -d app.exemplo.com` — ele reescreve este arquivo para
# adicionar o bloco 443 e o redirect automaticamente. Não tente prever a
# reescrita do certbot aqui; deixe ele fazer.
#
# Um domínio só, dois `location`: é a Decisão 1 do plano de deploy na VPS —
# same-origin de verdade, SameSite=Lax funciona sem ressalva, e não precisa de
# CORS. `/api/` vai para o `web` (gunicorn, publicado em 127.0.0.1:8000 pelo
# docker-compose.prod.yml); o resto vai para o `frontend` (nginx da imagem de
# produção, servindo o `dist/` com fallback de SPA, em 127.0.0.1:8080).
server {
    listen 80;
    server_name app.exemplo.com;

    # X-Forwarded-Proto é o que config/settings/prod.py:9 (SECURE_PROXY_SSL_HEADER)
    # espera para saber que a requisição chegou por HTTPS. Sem ele, todo
    # request vira redirect 301 em loop depois que o certbot ligar o
    # SECURE_SSL_REDIRECT — o Django acha que está recebendo HTTP puro mesmo
    # depois do TLS terminar aqui.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
    }

    location / {
        proxy_pass http://127.0.0.1:8080/;
    }
}
